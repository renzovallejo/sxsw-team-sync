<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Señales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0e0c0b;
    -webkit-font-smoothing: antialiased;
  }
  #root {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes pulse   { 0%,100%{transform:scale(1);opacity:.9;} 50%{transform:scale(1.08);opacity:1;} }
  @keyframes orbit   { to { transform: translateX(-50%) rotate(360deg); } }
  @keyframes flash   { 0%{opacity:.9;} 100%{opacity:0;} }
  @keyframes fadeUp  { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes slideIn { from{opacity:0;transform:translateX(32px);} to{opacity:1;transform:translateX(0);} }
  @keyframes slideBack { from{opacity:0;transform:translateX(-32px);} to{opacity:1;transform:translateX(0);} }

  .screen-in   { animation: fadeUp    300ms ease-out both; }
  .screen-push { animation: slideIn   260ms ease-out both; }
  .screen-pop  { animation: slideBack 260ms ease-out both; }

  ::-webkit-scrollbar { width:0; height:0; }

  /* On a real phone: go full-screen */
  @media (max-width: 430px) {
    .phone-shell {
      width: 100vw !important;
      height: 100dvh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="screen-onboarding.jsx"></script>
<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-camera.jsx"></script>
<script type="text/babel" src="screen-voice.jsx"></script>
<script type="text/babel" src="screen-text.jsx"></script>
<script type="text/babel" src="screen-processing.jsx"></script>
<script type="text/babel" src="screen-insight.jsx"></script>
<script type="text/babel" src="screen-detail.jsx"></script>
<script type="text/babel" src="screen-feed.jsx"></script>
<script type="text/babel" src="screen-publish.jsx"></script>
<script type="text/babel" src="screen-social.jsx"></script>
<script type="text/babel" src="screen-futuros.jsx"></script>
<script type="text/babel" src="screen-notifications.jsx"></script>
<script type="text/babel" src="screen-profile.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const ACCENT   = ACCENTS.tinta;
const TYPE_SYS = TYPE_SYSTEMS.editorial;

// Scale the phone frame to fit the viewport on desktop
function usePhoneScale(W, H) {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    function calc() {
      const sw = (window.innerWidth  - 40) / W;
      const sh = (window.innerHeight - 40) / H;
      setScale(Math.min(1, sw, sh));
    }
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, [W, H]);
  return scale;
}

function App() {
  const W = 390, H = 844;
  const scale = usePhoneScale(W, H);

  // Navigation stack — all routing lives here
  const [history, setHistory]         = useState(['onboarding']);
  const [dir, setDir]                 = useState('in');
  const [activeSignal, setActiveSignal] = useState(SAMPLE_SIGNALS[0]);
  const [showSheet, setShowSheet]     = useState(false);
  const [captureMode, setCaptureMode] = useState('photo');

  const stage = history[history.length - 1];

  function push(next)    { setDir('push');    setHistory(h => [...h, next]); }
  function pop()         { if (history.length > 1) { setDir('pop'); setHistory(h => h.slice(0, -1)); } }
  function replace(next) { setDir('in');      setHistory(h => [...h.slice(0, -1), next]); }
  function goRoot(tab)   { setDir('in');      setHistory([tab]); }

  const tabActive =
      ['home','feed'].includes(stage) ? 'home'
    : stage === 'social'   ? 'social'
    : stage === 'futuros'  ? 'futuros'
    : stage === 'profile'  ? 'profile'
    : null;

  function withTabBar(screen) {
    return (
      <>
        {screen}
        <TabBar
          active={tabActive}
          onTab={(t) => goRoot(t)}
          onCaptureSheet={() => setShowSheet(true)}
          accent={ACCENT} typeSys={TYPE_SYS}
        />
        {showSheet && (
          <CaptureSheet
            accent={ACCENT} typeSys={TYPE_SYS}
            onPick={(m) => { setShowSheet(false); setCaptureMode(m); push('camera'); }}
            onClose={() => setShowSheet(false)}
          />
        )}
      </>
    );
  }

  function renderStage() {
    switch (stage) {

      case 'onboarding':
        return (
          <OnboardingScreen
            accent={ACCENT} typeSys={TYPE_SYS}
            onDone={() => replace('home')}
          />
        );

      case 'home':
        return withTabBar(
          <HomeScreen
            signals={SAMPLE_SIGNALS} accent={ACCENT} typeSys={TYPE_SYS}
            onCapture={(m) => { setCaptureMode(m); push('camera'); }}
            onOpenSignal={(s) => { setActiveSignal(s); push('detail'); }}
            onOpenFeed={() => push('feed')}
            onOpenMap={() => push('feed')}
            onOpenNotifications={() => push('notifications')}
          />
        );

      case 'camera':
        if (captureMode === 'voice')
          return <VoiceScreen accent={ACCENT} typeSys={TYPE_SYS} onCapture={() => replace('processing')} onBack={pop}/>;
        if (captureMode === 'text')
          return <TextCaptureScreen accent={ACCENT} typeSys={TYPE_SYS} onCapture={() => replace('processing')} onBack={pop}/>;
        return <CameraScreen accent={ACCENT} typeSys={TYPE_SYS} onCapture={() => replace('processing')}/>;

      case 'processing':
        return <ProcessingScreen accent={ACCENT} typeSys={TYPE_SYS} onDone={() => replace('insight')}/>;

      case 'insight':
        return (
          <InsightEditorial
            signal={SAMPLE_SIGNALS[0]} accent={ACCENT} typeSys={TYPE_SYS}
            onOpen={() => { setActiveSignal(SAMPLE_SIGNALS[0]); push('publish'); }}
            onNewSignal={() => replace('camera')}
          />
        );

      case 'publish':
        return (
          <PublishScreen
            signal={activeSignal} accent={ACCENT} typeSys={TYPE_SYS}
            onBack={pop}
            onPublish={() => goRoot('feed')}
          />
        );

      case 'feed':
        return withTabBar(
          <FeedScreen
            signals={SAMPLE_SIGNALS} accent={ACCENT} typeSys={TYPE_SYS}
            onOpen={(s) => { setActiveSignal(s); push('detail'); }}
          />
        );

      case 'detail':
        return (
          <DetailScreen
            signal={activeSignal} accent={ACCENT} typeSys={TYPE_SYS}
            onBack={pop}
            onOpen={(s) => setActiveSignal(s)}
          />
        );

      case 'social':
        return withTabBar(
          <SocialScreen
            signals={SAMPLE_SIGNALS} accent={ACCENT} typeSys={TYPE_SYS}
            onOpen={(s) => { setActiveSignal(s); push('detail'); }}
          />
        );

      case 'futuros':
        return withTabBar(
          <FuturosScreen
            signals={SAMPLE_SIGNALS} accent={ACCENT} typeSys={TYPE_SYS}
            onOpenSignal={(s) => { setActiveSignal(s); push('detail'); }}
          />
        );

      case 'notifications':
        return (
          <NotificationsScreen
            accent={ACCENT} typeSys={TYPE_SYS}
            onBack={pop}
            onOpenSignal={() => { setActiveSignal(SAMPLE_SIGNALS[0]); push('detail'); }}
            onOpenFuturos={() => replace('futuros')}
            onOpenProfile={() => replace('profile')}
          />
        );

      case 'profile':
        return withTabBar(
          <ProfileScreen
            signals={SAMPLE_SIGNALS} accent={ACCENT} typeSys={TYPE_SYS}
            onOpen={(s) => { setActiveSignal(s); push('detail'); }}
          />
        );

      default:
        return null;
    }
  }

  const animClass =
      dir === 'push' ? 'screen-push'
    : dir === 'pop'  ? 'screen-pop'
    : 'screen-in';

  return (
    <div style={{
      width: '100vw', height: '100vh',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#0e0c0b',
    }}>
      {/* Glow behind the phone */}
      <div style={{
        position: 'fixed', inset: 0, pointerEvents: 'none',
        background: 'radial-gradient(ellipse 55% 45% at 50% 50%, rgba(31,58,138,0.2) 0%, transparent 70%)',
      }}/>

      <div
        className="phone-shell"
        style={{
          width: W, height: H,
          borderRadius: 48,
          overflow: 'hidden',
          position: 'relative',
          background: '#F2F2F7',
          boxShadow: '0 48px 96px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08)',
          transform: `scale(${scale})`,
          transformOrigin: 'center center',
          WebkitFontSmoothing: 'antialiased',
        }}
      >
        {/* Dynamic Island */}
        <div style={{
          position: 'absolute', top: 11, left: '50%',
          transform: 'translateX(-50%)',
          width: 126, height: 37,
          borderRadius: 24, background: '#000',
          zIndex: 50, pointerEvents: 'none',
        }}/>

        {/* Status bar */}
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0,
          zIndex: 40, pointerEvents: 'none',
        }}>
          <IOSStatusBar dark={false}/>
        </div>

        {/* Animated screen */}
        <div
          key={stage}
          className={animClass}
          style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}
        >
          {renderStage()}
        </div>

        {/* Home indicator */}
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0,
          height: 34, display: 'flex', justifyContent: 'center',
          alignItems: 'flex-end', paddingBottom: 8,
          zIndex: 60, pointerEvents: 'none',
        }}>
          <div style={{
            width: 139, height: 5, borderRadius: 100,
            background: 'rgba(0,0,0,0.22)',
          }}/>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
